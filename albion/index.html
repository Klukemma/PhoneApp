<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Albion Farm Profit</title>
<meta name="description" content="Work out what farming and crafting actually earns you in Albion Online.">
<meta name="theme-color" content="#0d0b08">
<meta name="mobile-web-app-capable" content="yes">
<!-- The apple- prefixed one is not a duplicate: iOS before 16.4 reads only
     this, and without it the app opens in Safari's chrome rather than
     fullscreen when you launch it from the home screen. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Profit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="viewTitle">Plan</h1>
    <div class="spacer"></div>
    <button id="topAct" class="top-act hide"></button>
  </header>

  <main id="view"></main>

  <nav id="nav">
    <button data-view="plan" aria-current="page"><span class="e">&#127806;</span>Plan</button>
    <button data-view="craft"><span class="e">&#9878;&#65039;</span>Craft</button>
    <button data-view="wild"><span class="e">&#9935;&#65039;</span>Gather</button>
    <button data-view="rank"><span class="e">&#128200;</span>Best</button>
    <button data-view="prices"><span class="e">&#127974;</span>Market</button>
    <button data-view="me"><span class="e">&#128100;</span>Me</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" class="hide"></button></div>

<!-- Chrome decides when the app qualifies to be installed and fires this once.
     It can fire before a deferred module has run, and an event you did not
     hear is an install you cannot offer - so it is caught here, inline, and
     js/install.js picks it up whenever it gets around to asking. -->
<script>
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__installPrompt = e;
  });
  window.addEventListener('appinstalled', () => { window.__installPrompt = null; });
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
