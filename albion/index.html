<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Albion Farm Profit</title>
<meta name="description" content="Work out what farming and crafting actually earns you in Albion Online.">
<meta name="theme-color" content="#0c0a07">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1 id="viewTitle">Plan</h1>
      <div class="sub" id="viewSub"></div>
    </div>
    <div class="spacer"></div>
    <div class="stamp" id="dataStamp"></div>
    <button id="gearBtn" aria-label="Setup">&#9881;&#65039;</button>
  </header>

  <main id="view"></main>

  <nav id="nav">
    <button data-view="plan" aria-current="page"><span class="e">&#127806;</span>Plan</button>
    <button data-view="craft"><span class="e">&#9878;&#65039;</span>Craft</button>
    <button data-view="rank"><span class="e">&#128200;</span>Best</button>
    <button data-view="prices"><span class="e">&#128176;</span>Prices</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" class="hide"></button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
