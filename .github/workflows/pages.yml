# Publishes the app to GitHub Pages so it can be installed on a phone.
# Pages is switched on by the configure-pages step below, so no manual repo
# setup is needed. If that step is ever blocked, turn it on by hand at
# Settings -> Pages -> Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    # Also covers the working branch, so the app publishes before this is
    # merged into main.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on via the API, so the repo does not have to be
      # configured by hand before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish only what the app needs — not .git, tests or tooling.
      - name: Stage the site
        run: |
          mkdir -p _site/albion
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          cp -r albion/index.html albion/manifest.webmanifest albion/sw.js \
                albion/css albion/js albion/icons albion/data _site/albion/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
