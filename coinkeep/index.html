<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CoinKeep</title>
<meta name="description" content="Daily spending limit that keeps you on track for your savings goal.">
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1 id="viewTitle">Today</h1>
      <div class="sub" id="viewSub"></div>
    </div>
    <div class="spacer"></div>
    <button class="balance" id="balanceBtn">
      <div class="k">Balance</div>
      <div class="v num" id="balanceVal">—</div>
    </button>
    <button id="gearBtn" aria-label="Settings" style="font-size:20px;opacity:.65;padding:6px">⚙️</button>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Add an expense">+</button>

  <nav id="nav">
    <button data-view="today" aria-current="page"><span class="e">🎯</span>Today</button>
    <button data-view="log"><span class="e">🧾</span>Log</button>
    <span class="gap"></span>
    <button data-view="bills"><span class="e">🔁</span>Bills</button>
    <button data-view="stats"><span class="e">📊</span>Stats</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" class="hide"></button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
